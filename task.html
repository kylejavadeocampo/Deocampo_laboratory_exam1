<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <title>Task</title>
</head>
<body>
    <div id="nav-placeholder"></div>

    <!-- head -->
    <div class="container">
        <h1>My tasks</h1>
        <p class="fst-italic">Add, manage, and complete your tasks efficiently.</p>
    </div>

    <!-- add task form -->
    <div class="container mt-4">
        <form id="task-form" class="row g-3">
            <div class="col-md-3">
                <input type="text" class="form-control" id="task-input" placeholder="Enter a new task" required>
            </div>
            <div class="col-md-3">
                <input type="date" class="form-control">
            </div>
            <div class="col-md-3">
                <select class="form-control" name="priority" id="prio">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100">Add Task</button>
            </div>
        </form>
    </div>

    <!-- kpi -->
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">Total Tasks</h5>
                        <p class="card-text" id="total-tasks">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">Completed Tasks</h5>
                        <p class="card-text" id="completed-tasks">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center">
                    <div class="card-body">
                        <h5 class="card-title">Pending Tasks</h5>
                        <p class="card-text" id="pending-tasks">0</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- task -->
    <div class="container mt-4">
        <div class="row justify-content-between">
            <div class="col-auto">
                <input class="form-control" placeholder="Search for...">
            </div>
            <div class="col-auto">
                <button type="button" class="btn btn-warning">Clear all</button>
            </div>
        </div>
    </div>
    <div class="container mt-4">
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">#</th>
                    <th scope="col">Task Title</th>
                    <th scope="col">Due Date</th>
                    <th scope="col">Priority</th>
                    <th scope="col">Status</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>
    </div>
    <script src="javascript.js"></script>
</body>
</html>
